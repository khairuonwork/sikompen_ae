services:
  app:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8080}"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      DB_CACHE_CONNECTION: kompen_db
      DB_CACHE_TABLE: sikompen_cache
      DB_CACHE_LOCK_CONNECTION: kompen_db
      DB_CACHE_LOCK_TABLE: sikompen_cache_locks
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket === false ? 1 : 0);'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "9000"
    volumes:
      - sikompen_import_storage:/var/www/html/storage/app/private/kompen-respon-hub/imports
      - sikompen_export_storage:/var/www/html/storage/app/private/kompen-respon-hub/exports
      - sikompen_api_sync_storage:/var/www/html/storage/app/private/kompen-respon-hub/api-sync

  web:
    build:
      context: .
      target: web
    image: sikompen-web:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"

  api-mini-app:
    build:
      context: ./api-mini-app
    image: sikompen-api-mini-app:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      web:
        condition: service_started
    ports:
      - "${API_MINI_APP_BIND_HOST:-127.0.0.1}:${API_MINI_APP_PORT:-8090}:8000"
    networks:
      default:
        ipv4_address: "${API_MINI_APP_IP:-172.30.0.10}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    init: true
    command: php artisan queue:work database --sleep=3 --tries=1 --timeout=600 --memory=90%
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8080}"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      DB_CACHE_CONNECTION: kompen_db
      DB_CACHE_TABLE: sikompen_cache
      DB_CACHE_LOCK_CONNECTION: kompen_db
      DB_CACHE_LOCK_TABLE: sikompen_cache_locks
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sikompen_import_storage:/var/www/html/storage/app/private/kompen-respon-hub/imports
      - sikompen_export_storage:/var/www/html/storage/app/private/kompen-respon-hub/exports

  imports:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    init: true
    command: php artisan queue:work database --queue=${SIKOMPEN_IMPORT_QUEUE:-imports} --sleep=3 --tries=1 --timeout=600 --memory=90%
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8080}"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      DB_CACHE_CONNECTION: kompen_db
      DB_CACHE_TABLE: sikompen_cache
      DB_CACHE_LOCK_CONNECTION: kompen_db
      DB_CACHE_LOCK_TABLE: sikompen_cache_locks
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sikompen_import_storage:/var/www/html/storage/app/private/kompen-respon-hub/imports

  exports:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    init: true
    command: php artisan queue:work database --queue=${SIKOMPEN_EXPORT_QUEUE:-exports} --sleep=3 --tries=1 --timeout=600 --memory=90%
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8080}"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      DB_CACHE_CONNECTION: kompen_db
      DB_CACHE_TABLE: sikompen_cache
      DB_CACHE_LOCK_CONNECTION: kompen_db
      DB_CACHE_LOCK_TABLE: sikompen_cache_locks
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sikompen_export_storage:/var/www/html/storage/app/private/kompen-respon-hub/exports

  api-sync:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    init: true
    command: php artisan queue:work database --queue=${SIKOMPEN_API_SYNC_QUEUE:-api-sync} --sleep=3 --tries=1 --timeout=600 --memory=90%
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8080}"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      DB_CACHE_CONNECTION: kompen_db
      DB_CACHE_TABLE: sikompen_cache
      DB_CACHE_LOCK_CONNECTION: kompen_db
      DB_CACHE_LOCK_TABLE: sikompen_cache_locks
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sikompen_api_sync_storage:/var/www/html/storage/app/private/kompen-respon-hub/api-sync

  scheduler:
    build:
      context: .
      target: app
    image: sikompen-app:local
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_STACK: stderr
      LOG_LEVEL: warning
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      KOMPEN_DB_HOST: database
      KOMPEN_DB_PORT: 3306
      KOMPEN_DB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      KOMPEN_DB_USERNAME: "${KOMPEN_DB_USERNAME:-kompen_user}"
      KOMPEN_DB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sikompen_api_sync_storage:/var/www/html/storage/app/private/kompen-respon-hub/api-sync

  database:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KOMPEN_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      MARIADB_USER: "${KOMPEN_DB_USERNAME:-kompen_user}"
      MARIADB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      MARIADB_ROOT_PASSWORD: "${KOMPEN_DB_ROOT_PASSWORD:-change_this_local_root_password}"
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - sikompen_database_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sikompen_database_data:
  sikompen_import_storage:
    name: sikompen_import_storage
  sikompen_export_storage:
    name: sikompen_export_storage
  sikompen_api_sync_storage:
    name: sikompen_api_sync_storage

networks:
  default:
    name: "${SIKOMPEN_NETWORK_NAME:-sikompen_internal}"
    ipam:
      config:
        - subnet: "${SIKOMPEN_NETWORK_SUBNET:-172.30.0.0/24}"
