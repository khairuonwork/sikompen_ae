services:
  database:
    image: mariadb:11.4
    container_name: kompen-respon-hub-db
    restart: unless-stopped
    ports:
      - "${KOMPEN_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: "${KOMPEN_DB_DATABASE:-kompen_database}"
      MARIADB_USER: "${KOMPEN_DB_USERNAME:-kompen_user}"
      MARIADB_PASSWORD: "${KOMPEN_DB_PASSWORD:-kompen_local_password}"
      MARIADB_ROOT_PASSWORD: "${KOMPEN_DB_ROOT_PASSWORD:-change_this_local_root_password}"
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - kompen_respon_hub_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kompen_respon_hub_db_data:
