name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force
          npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run CI Checks
        run: composer ci:check

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate API Mini App syntax
        run: python3 -m compileall -q api-mini-app

  deploy-staging:
    name: Deploy staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: sikompen-staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Connect to the private deployment network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:sikompen-ci
          hostname: sikompen-staging-${{ github.run_id }}
          ping: 100.127.247.109

      - name: Deploy the verified revision
        env:
          DEPLOY_HOST: 100.127.247.109
          DEPLOY_USER: khairuonlab
          DEPLOY_PATH: /home/khairuonlab/apps/kompen-respon-hub
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "SIKOMPEN_DEPLOY_PATH='${DEPLOY_PATH}' SIKOMPEN_DEPLOY_BRANCH=staging SIKOMPEN_DEPLOY_REF='${DEPLOY_REF}' bash '${DEPLOY_PATH}/deployment/scripts/deploy-staging.sh'"
