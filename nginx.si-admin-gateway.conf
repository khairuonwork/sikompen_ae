# Konfigurasi Nginx PUBLIK yang digabungkan dengan deployment Si-Admin.
# Semua URL /sikompen/ harus melewati gateway Si-Admin, bukan sikompen-web.

upstream si_admin_gateway {
    server si-admin-web:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;
    client_body_timeout 600s;
    send_timeout 600s;
    server_tokens off;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /sikompen {
        return 308 /sikompen/$is_args$args;
    }

    location ^~ /sikompen/ {
        # Si-Admin memvalidasi session lalu meneruskan ke sikompen-web.
        # Jangan mengganti upstream ini dengan sikompen-web.
        proxy_pass http://si_admin_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sikompen;

        # Hanya backend Si-Admin yang boleh membuat header HMAC ini.
        proxy_set_header X-Si-Admin-User-Id "";
        proxy_set_header X-Si-Admin-Email "";
        proxy_set_header X-Si-Admin-Role "";
        proxy_set_header X-Si-Admin-Timestamp "";
        proxy_set_header X-Si-Admin-Nonce "";
        proxy_set_header X-Si-Admin-Signature "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://si_admin_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Si-Admin-User-Id "";
        proxy_set_header X-Si-Admin-Email "";
        proxy_set_header X-Si-Admin-Role "";
        proxy_set_header X-Si-Admin-Timestamp "";
        proxy_set_header X-Si-Admin-Nonce "";
        proxy_set_header X-Si-Admin-Signature "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
