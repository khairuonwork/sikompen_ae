server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker may assign a new IP address when the PHP-FPM container is recreated.
    # Resolve the service name per request so Nginx does not retain the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm_upstream app:9000;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 5m;
    client_body_buffer_size 64k;
    client_body_timeout 600s;
    client_header_timeout 15s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    send_timeout 600s;
    reset_timedout_connection on;
    limit_conn sikompen_connections_per_ip 20;

    include /etc/nginx/conf.d/realip.conf;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location ~* ^/(?:\.env|\.git|\.svn|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml) {
        access_log off;
        log_not_found off;
        deny all;
    }

    location ~* \.(?:bak|conf|dist|fla|ini|log|psd|sh|sql|sqlite|swp)$ {
        access_log off;
        log_not_found off;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors on;
        limit_req zone=sikompen_dynamic_per_ip burst=60 nodelay;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 600s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
